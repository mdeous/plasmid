{{define "title"}}SAML Inspector{{end}}
{{define "content"}}
<div class="page-header">
    <h1>SAML Inspector</h1>
    <div class="page-actions">
        <button class="outline secondary" hx-post="/ui/inspector/clear" hx-confirm="Clear all captured exchanges?" hx-target="body" hx-swap="none" hx-on::after-request="if(event.detail.successful) window.location.reload()">Clear captures</button>
    </div>
</div>

<div id="inspector-filters" class="inspector-filters">
    <select id="filter-direction" onchange="applyInspectorFilters()">
        <option value="">All</option>
        <option value="Request">Requests</option>
        <option value="Response">Responses</option>
    </select>
    <input type="text" id="filter-text" placeholder="Filter by SP, NameID, endpoint…" oninput="applyInspectorFilters()">
</div>

<div hx-get="/ui/inspector/exchanges" hx-trigger="every 2s" hx-swap="innerHTML" hx-on::after-swap="applyInspectorFilters()">
    {{template "inspector_table" .Exchanges}}
</div>

<hr>
<div id="exchange-detail">
    {{if .OpenExchange}}{{template "inspector_detail" .OpenExchange}}{{end}}
</div>
{{end}}
