# host/port carry the SAML endpoints an SP has to reach, and are what you
# expose through a tunnel. base_url is the public URL they are reached on.
host: 127.0.0.1
port: 8000
base_url: http://127.0.0.1:8000
# admin_host/admin_port carry the dashboard and the REST API. Nothing there
# authenticates the caller, so keep this bound to loopback and never tunnel it.
admin_host: 127.0.0.1
admin_port: 8001
# nameid_format is stamped onto every session and advertised in the IdP
# metadata. The library's own default is transient, which most SPs cannot
# resolve to a user. Leave this empty to get that default back.
nameid_format: urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress
# signature_method is the XML signature algorithm assertions and responses are
# signed with. crewjam/saml falls back to rsa-sha1, which modern SPs reject;
# select it on purpose to test whether an SP still accepts a downgrade.
signature_method: http://www.w3.org/2001/04/xmldsig-more#rsa-sha256
# include_subject_address puts the client address in SubjectConfirmationData
# and SubjectLocality. The library takes it from RemoteAddr, which is
# "host:port" and behind a tunnel is loopback, and a conforming SP rejects the
# assertion over it, so it is left out by default.
include_subject_address: false
# send_unencrypted seeds the tamper engine so assertions go out signed but
# unencrypted from startup, which is the only way to read them in the
# inspector. An SP that publishes an encryption certificate is asking for
# encryption, so this is a deviation and is reported as a tamper modification.
send_unencrypted: false
# metadata_file is where the IdP metadata document is exported at startup.
# Leave it empty to skip the export and serve the document on /metadata only.
metadata_file: idp-metadata.xml
# metadata_valid_days is how far out the metadata's validUntil is set. Zero
# tracks the signing certificate's own expiry, so a pinned certificate and the
# document advertising it cannot disagree. crewjam/saml would otherwise stamp
# 48h here regardless of the certificate, which reads to an SP as the IdP
# expiring in two days. Set a positive value to probe an SP that enforces
# validUntil.
metadata_valid_days: 0
cert:
  ca_org: Example Org
  ca_country: FR
  ca_state: Ile de France
  ca_locality: Paris
  ca_address: ""
  ca_postcode: 75001
  # ca_exp_years is the generated certificate's own lifetime. It is also what
  # metadata_valid_days defaults to following.
  ca_exp_years: 1
  key_size: 2048
  # certificate_file and key_file determine where the cert and priv key
  # are saved to / loaded from. Plasmid will attempt to load them, and
  # will generate new ones if they can't be found.
  certificate_file: plasmid-cert.pem
  key_file: plasmid-key.pem
user:
  username: admin
  password: Password123
  given_name: Admin
  surname: User
  email: admin@example.com
  groups:
    - Administrators
    - Users
sp:
  name: samltest
  metadata: https://samltest.id/saml/sp
